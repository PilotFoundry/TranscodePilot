name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conversion engines
        run: brew install ffmpeg librsvg
      - name: Show engine versions
        run: make doctor
      - name: Validate shell scripts and metadata inputs
        run: |
          for script in scripts/*; do sh -n "$script"; done
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ci.yml"); puts "CI YAML OK"'
      - name: Build and run checks
        run: make check
      - name: Build app bundle
        run: make app
      - name: Verify metadata and localization
        run: make verify
      - name: Build release configuration
        run: make release
      - name: Package ad-hoc preview
        run: make package
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: transcodepilot-preview
          path: |
            .build/TranscodePilot.app
            .build/release/*.zip
            .build/release/*.sha256
