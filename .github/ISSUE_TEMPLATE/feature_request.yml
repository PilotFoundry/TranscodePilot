name: Feature request
description: Suggest a workflow, format or accessibility improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow is currently hard or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Conversion format
        - UI/UX
        - Accessibility
        - Localization
        - Packaging/release
        - Documentation
        - Other
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: The proposal can remain local-first, with no telemetry or network resource fetching.
          required: true
